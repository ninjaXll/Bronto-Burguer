<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrinho - Bronto Burger</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    .cart-container {
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
      background-color: white;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }

    .cart-header {
      display: flex;
      justify-content: space-between;
      font-weight: bold;
      padding-bottom: 10px;
      border-bottom: 1px solid #eee;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 0;
      border-bottom: 1px solid #eee;
    }

    .cart-item-info {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .cart-item img {
      width: 60px;
      height: 60px;
      object-fit: cover;
      border-radius: 8px;
    }

    .cart-item-details h3 {
      margin: 0;
      font-size: 1.1rem;
      color: #ff6b35;
    }

    .cart-item-details p {
      margin: 5px 0 0;
      font-size: 0.9rem;
      color: #666;
    }

    .cart-item-price {
      font-weight: bold;
      color: #4a6b4a;
    }

    .cart-total {
      text-align: right;
      font-size: 1.3rem;
      font-weight: bold;
      margin: 20px 0;
      color: #5d4037;
    }

    .checkout-btn {
      display: block;
      width: 100%;
      padding: 15px;
      background-color: #25D366; /* Verde do WhatsApp */
      color: white;
      text-align: center;
      text-decoration: none;
      border-radius: 8px;
      font-size: 1.2rem;
      font-weight: bold;
      transition: background-color 0.3s;
    }

    .checkout-btn:hover {
      background-color: #1da851;
    }

    .empty-cart {
      text-align: center;
      padding: 40px 0;
      color: #666;
    }
  </style>
</head>
<body>

  <!-- Cabeçalho -->
  <header>
    <div class="logo">
      <img src="../assets/images/logo-bronto-burger.png" alt="Bronto Burger">
    </div>
    <button class="menu-toggle">☰</button>
    <nav>
      <ul>
        <li><a href="/index.html">Home</a></li>
        <li><a href="/pages/cardapio.html">Cardápio</a></li>
        <li><a href="../index.html#sobre">Sobre Nós</a></li>
        <li><a href="../index.html#contato">Contato</a></li>
      </ul>
    </nav>
    <div class="cart-icon">
      <a href="carrinho.html" id="cart-link">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="#fff">
          <path d="M7 18c-1.1 0-1.99-.9-1.99-2H3c-1.1 0-2-.9-2-2V8c0-1.1.9-2 2-2h2C5.1 6 6 6.9 6 8h12c1.1 0 2 .9 2 2v1h2c1.1 0 2 .9 2 2v1c0 1.1-.9 2-2 2h-2c0 1.1-.9 2-2 2H7zm10-4H7v4h10v-4z"/>
        </svg>
        <span id="cart-count">0</span>
      </a>
    </div>
  </header>

  <!-- Conteúdo da Página -->
  <main>
    <div class="cart-container">
      <h2>Seu Carrinho</h2>

      <div id="cart-items">
        <!-- Os itens serão inseridos aqui pelo JavaScript -->
      </div>

      <div id="cart-empty" class="empty-cart" style="display: none;">
        Seu carrinho está vazio.
      </div>

      <div class="cart-total" id="cart-total">
        Total: R$ 0,00
      </div>

      <button id="checkout-btn" class="checkout-btn">Finalizar Pedido no WhatsApp</button>
    </div>
  </main>

  <script src="../script.js"></script>
  <script>
    // Função para carregar o carrinho na página de carrinho
    document.addEventListener('DOMContentLoaded', function() {
      loadCart();

      const cartItemsContainer = document.getElementById('cart-items');
      const cartEmptyContainer = document.getElementById('cart-empty');
      const cartTotalContainer = document.getElementById('cart-total');
      const checkoutBtn = document.getElementById('checkout-btn');

      //Elementos do Modal
      const modal = document.getElementById('info-modal');
      const orderForm = document.getElementById('order-form');
      const cancelModal = document.getElementById('cancel-modal');
      const deliveryAddressDiv = document.getElementById('delivery-address');
      const changeSection = document.getElementById('change-section');

      //Referência para os inputs de tipo de Entrega
      const deliveryRadio = document.querySelector('input[name="delivery-type"][value="entrega"]');
      const pickupRadio = document.querySelector('input[name="delivery-type"][value="retirada"]');

      //Referência para os inputs de Forma de pagamento
      const paymentRadios = document.querySelectorAll('input[name="payment-method"]');

      if (cart.length === 0) {
        cartItemsContainer.style.display = 'none';
        cartEmptyContainer.style.display = 'block';
        cartTotalContainer.textContent = 'Total: R$ 0,00';
        checkoutBtn.disabled = true;
        checkoutBtn.style.opacity = '0.5';
        checkoutBtn.style.pointerEvents = 'none';
      } else {
        cartItemsContainer.innerHTML = '';
        let total = 0;

        cart.forEach(item => {
          total += item.price * item.quantity;
          const itemElement = document.createElement('div');
          itemElement.className = 'cart-item';
          itemElement.innerHTML = `
            <div class="cart-item-info">
              <div class="cart-item-details">
                <h3>${item.name}</h3>
                <p>${item.quantity}x</p>
              </div>
            </div>
            <div class="cart-item-price">R ${(item.price * item.quantity).toFixed(2).replace('.', ',')}</div>
          `;
          cartItemsContainer.appendChild(itemElement);
        });

        cartTotalContainer.textContent = `Total: R$ ${total.toFixed(2).replace('.', ',')}`;
        
        //Abrir modal ao clicar no botão de checkout
        checkoutBtn.addEventListener('click',function(e){
          e.preventDefault();
          document.getElementById('info-modal').style.display = 'flex';
        });
      }

      //Evento para mostrar/ocultar endereço de entrega
      if(deliveryRadio && pickupRadio){
        deliveryRadio.addEventListener('change', function(){
          if(this.checked){
            document.getElementById('delivery-address').style.display = 'block';
          }
        });

        pickupRadio.addEventListener('change', function(){
          if(this.checked){
            document.getElementById('delivery-address').style.display = 'none';
          }
        });
      }

      //Evento para mostrar/ocultar campo de troco
      paymentRadios.forEach(radio => {
        radio.addEventListener('change', function(){
          if(this.value === 'dinheiro'){
            document.getElementById('change-section').style.display = 'block';
          } else {
            document.getElementById('change-section').style.display = 'none';
          }
        });
      });

      //fechar o modal
      cancelModal.addEventListener('click', function(){
        document.getElementById('info-modal').style.display = 'none';
      });

      //fechar modal ao clicar fora
      window.addEventListener('click', function(e){
        if(e.target === document.getElementById('info-modal')){
          document.getElementById('info-modal').style.display = 'none';
        }
      });

      //Processar envio de formulário
      orderForm.addEventListener('submit', function(e){
        e.preventDefault();

        const formData = {
          name: document.getElementById('customer-name').value,
          deliveryType: document.querySelector('input[name="delivery-type"]:checked').value,
          address: document.getElementById('address').value,
          paymentMethod: document.querySelector('input[name="payment-method"]:checked').value,
          changeValue: document.getElementById('change-value').value
        };

        //Preparar mensagem para o WhatsApp
        let message = `* Novo Pedido - Bronto Burger*\\n\\n`;
        message += `*Cliente:* ${formData.name}\\n\\n`;

        //Itens do pedido
        message += `*Itens do Pedido:*\\n`;
        cart.forEach(item => {
          message += `- ${item.name} x${item.quantity} = R$ ${(item.price * item.quantity).toFixed(2).replace('.', ',')}\\n`;
        });

        message += `\\n*Total:* R$ ${total.toFixed(2).replace('.', ',')}\\n\\n`;

        if(formaData.deliveryType === 'entrega') {
          message += `*Tipo de Entrega:* Entrega\\n`;
          message += `*Endereço:* ${formData.address}\\n\\n`;
          message += `*Taxa de Entrega:* R$ 5,00\\n`;
          message += `*Total com Entrega:* R$ ${(total + 5).toFixed(2).replace('.', ',')}\\n\\n`;
        } else {
          message += `*Tipo de Entrega:* Retirada no Local\\n\\n`;
        }

        //Forma de pagamento
        let paymentText = '';
        switch(formData.paymentMethod){
          case 'cartao':arguments
            paymentText = 'Cartão de Crédito/Débito';
            break;
          case 'pix':
            paymentText = 'PIX';
            break;
          case 'dinheiro':
            paymentText = 'Dinheiro';
            if(formData.changeValue > 0){
              paymentText += `(Troco para R$ ${parseFloat(formData.changeValue).toFixed(2).replace('.', ',')})\\n`;
            }
            break; 
        }

        message += `*Forma de Pagamento:* ${paymentText}\\n`;

        //Codificar mensagem para URL
        const encodedMessage = encodeURIComponent(message);
        const whatsappUrl = `https://wa.me/5511999999999?text=${encodedMessage}`;

        //Abrir WhatsApp com a mensagem
        window.open(whatsappUrl, '_blank');

        //fechar o modal
        document.getElementById('info-modal').style.display = 'none';
      });
    });

  </script>

  <!--Modal de Coleta de Informações-->
  <div id="info-modal" class="modal-overlay">
        <div class="modal-content">
          <h3>Dados para Finalizar Pedido</h3>
          <form id="order-form">
            <div class="form-group">
              <label for="customer-name">Nome Completo:</label>
              <input type="text" id="customer-name" required placeholder="Digite seu nome completo">
            </div>

            <div class="form-group">
              <label>Tipo de Entrega:</label>
              <div class="radio-group">
                <label class="radio-option">
                  <input type="radio" name="delivery-type" value="entrega" checked>Entrega
                </label>
                <label class="radio-option">
                  <input type="radio" name="delivery-type" value="retirada"> Retirada no Local
                </label>
              </div>
            </div>

            <div id="delivery-address" class="form-group">
              <label for="address">Endereço de Entrega*</label>
              <textarea id="address" required placeholder="Rua, número, bairro, complemento..."></textarea>
              <p class="delivery-fee">Taxa de Entrega: R$ 5,00</p>
            </div>

            <div class="form-group">
              <label>Forma de Pagamento:</label>
              <div class="radio-group">
                <label class="radio-option">
                  <input type="radio" name="payment-method" value="cartao" required> Cartão (Crédito/Débito)
                </label>
                <label class="radio-option">
                  <input type="radio" name="payment-method" value="pix" required> PIX
                </label>
                <label class="radio-option">
                  <input type="radio" name="payment-method" value="dinheiro" required> Dinheiro
                </label>
              </div>
            </div>

            <div id="change-section" class="form-group" style="display: none;">
              <label for="change-value">Valor para Troco:(opcional)</label>
              <input type="number" id="change-value" min="0" step="0.01" placeholder="Valor em dinheiro para troco">
            </div>

            <div class="modal-actions">
              <button type="button" id="cancel-modal" class="btn-secondary">Cancelar</button>
              <button type="submit" id="send-whatsapp" class="btn-primary">Enviar Pedido via WhatsApp</button>
            </div>

          </form>
            
        </div>
  </div>

</body>
</html>
