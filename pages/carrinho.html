<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrinho - Bronto Burger</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>

  <!-- Cabeçalho -->
  <header>
    <div class="logo">
      <img src="../assets/images/logo-bronto-burger.png" alt="Bronto Burger">
    </div>
    <button class="menu-toggle">☰</button>
    <nav>
      <ul>
        <li><a href="/index.html">Home</a></li>
        <li><a href="/pages/cardapio.html">Cardápio</a></li>
        <li><a href="../index.html#sobre">Sobre Nós</a></li>
        <li><a href="../index.html#contato">Contato</a></li>
      </ul>
    </nav>
    <div class="cart-icon">
      <a href="carrinho.html" id="cart-link">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="#fff">
          <path d="M7 18c-1.1 0-1.99-.9-1.99-2H3c-1.1 0-2-.9-2-2V8c0-1.1.9-2 2-2h2C5.1 6 6 6.9 6 8h12c1.1 0 2 .9 2 2v1h2c1.1 0 2 .9 2 2v1c0 1.1-.9 2-2 2h-2c0 1.1-.9 2-2 2H7zm10-4H7v4h10v-4z"/>
        </svg>
        <span id="cart-count">0</span>
      </a>
    </div>
  </header>

  <!-- Conteúdo da Página -->
  <div class="cart-container">
  <h2>Seu Carrinho</h2>

  <!-- Itens do Carrinho -->
  <div id="cart-items" class="cart-items">
    <!-- Os itens serão inseridos aqui pelo JavaScript -->
  </div>

  <!-- Total -->
  <div class="cart-total" id="cart-total">
    Total: R$ 0,00
  </div>

  <!-- Formulário de Finalização -->
  <div class="checkout-form">
    <h3>Dados para Finalizar Pedido</h3>
    <form id="pedido-form">
      <label for="customer-name">Nome Completo:</label>
      <input type="text" id="customer-name" required placeholder="Digite seu nome completo">

      <label for="order-type">Tipo de Pedido:</label>
      <select id="order-type" required>
        <option value="">Selecione...</option>
        <option value="retirada">Retirada no Local</option>
        <option value="entrega">Entrega</option>
      </select>

      <div id="delivery-info" style="display: none;">
        <label for="address">Endereço de Entrega:</label>
        <textarea id="address" required placeholder="Ex: Rua dos Dinossauros, 123 - Centro"></textarea>
        <p><strong>Taxa de Entrega:</strong> R$ 5,00</p>
      </div>

      <label for="payment-method">Forma de Pagamento:</label>
      <select id="payment-method" required>
        <option value="">Selecione...</option>
        <option value="cartao">Cartão (Crédito/Débito)</option>
        <option value="pix">Pix</option>
        <option value="dinheiro">Dinheiro</option>
      </select>

      <div id="troco-info" style="display: none;">
        <label for="troco-value">Valor para Troco:</label>
        <input type="number" id="troco-value" step="0.01" placeholder="Ex: 150,00">
      </div>

      <button type="submit" class="checkout-btn">Finalizar Pedido</button>
    </form>
  </div>
</div>
  </main>

  <script src="/script.js"></script>

</body>
</html>
