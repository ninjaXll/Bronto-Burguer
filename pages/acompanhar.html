<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acompanhar Pedido - Bronto Burger</title>
  <link rel="stylesheet" href="../style.css"> <!-- Caminho para o CSS principal -->
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Open+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="logo">
      <img src="../assets/images/logo-bronto-burger.png" alt="Bronto Burger" class="logo__img">
    </div>
    <button class="menu-toggle">☰</button>
    <nav class="nav">
      <ul class="nav__list">
        <li><a href="../index.html#home" class="nav__link">Home</a></li>
        <li><a href="../pages/cardapio.html" class="nav__link">Cardápio</a></li>
        <li><a href="../index.html#sobre" class="nav__link">Sobre Nós</a></li>
        <li><a href="../index.html#contato" class="nav__link">Contato</a></li>
      </ul>
    </nav>
    <div class="cart-icon">
      <a href="carrinho.html" id="cart-link">
        <div class="cart-badge">
          <svg class="cart-svg-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="9" cy="21" r="1"></circle>
            <circle cx="20" cy="21" r="1"></circle>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.6L23 6H6"></path>
          </svg>
          <span class="cart-counter" id="cart-count">0</span>
        </div>
      </a>
    </div>
  </header>

  <main>
    <div class="track-order-container">
      <h2>Acompanhar Pedido</h2>
      <p>Insira o número do seu pedido para verificar o status.</p>

      <form id="track-order-form">
        <label for="order-number">Número do Pedido:</label>
        <input type="text" id="order-number" name="order-number" placeholder="Ex: 12345" required>

        <button type="submit" class="track-btn">Ver Status</button>
      </form>

      <div id="order-status" class="order-status">
        <!-- O status do pedido será exibido aqui -->
      </div>

      <a href="carrinho.html" class="back-to-menu">Voltar ao Carrinho</a>
    </div>
  </main>

  <script src="../script.js"></script>

</body>
</html>
